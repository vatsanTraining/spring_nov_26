spring:
  main:
    web-application-type: none
  application:
    name: spring_batch_processing
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: true
